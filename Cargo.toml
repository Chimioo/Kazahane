[package]
name = "kazahane"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kazae"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
glob = "0.3"
regex = "1"
